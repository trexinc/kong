# THROWAWAY spike Kong config (DB-less).
#
# lua_package_path must let Kong resolve kong.plugins.spike-stream-bridge.*
# The plugin lives at spike/kong/plugins/spike-stream-bridge/, so the package
# path entry points at the spike/ root. test.sh sets this to an absolute path
# via `kong start --conf` env override; if you run kong directly, edit below.

database = off
declarative_config = ./kong.yml

plugins = bundled,spike-stream-bridge

# Set to an ABSOLUTE path to <repo>/spike when running manually:
# lua_package_path = /abs/path/to/repo/spike/?.lua;;
lua_package_path = ../?.lua;;

proxy_listen = 0.0.0.0:8000
admin_listen = 127.0.0.1:8001

# Keep the noise down for the spike.
log_level = info
