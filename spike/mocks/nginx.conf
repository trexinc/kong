# THROWAWAY spike mocks. Run with OpenResty, standalone from Kong:
#   cd spike/mocks && mkdir -p logs && openresty -p "$PWD" -c nginx.conf
#
#   :9000/sse      -> mock LLM SSE stream (chunks emitted with delays)
#   :9001/analyze  -> mock Cato Networks guardrail WS (decoupled verdicts)

worker_processes  1;
error_log  /dev/stderr info;   # visible via `docker compose logs mocks` and in a local terminal
pid        logs/nginx.pid;

events { worker_connections 1024; }

http {
  lua_socket_log_errors off;

  # ---- mock LLM upstream: Server-Sent Events with inter-chunk delays ----
  server {
    listen 9000;

    location /sse {
      content_by_lua_block {
        ngx.status = 200
        ngx.header["Content-Type"] = "text/event-stream"
        ngx.header["Cache-Control"] = "no-cache"

        local n = tonumber(ngx.var.arg_n) or 8
        for i = 1, n do
          ngx.print('data: {"choices":[{"delta":{"content":"tok' .. i .. '"}}]}\n\n')
          ngx.flush(true)
          ngx.sleep(0.25)   -- prove the read side is genuinely streaming
        end
        ngx.print("data: [DONE]\n\n")
        ngx.eof()
      }
    }
  }

  # ---- mock Cato Networks guardrail WS ----
  # Verdicts are intentionally NOT 1:1 with received chunks:
  #   * lookahead: a chunk's verdict is only emitted once the NEXT chunk
  #     arrives (the last one flushes on upstream_done) -> exercises hold-back.
  #   * even-numbered chunks are uppercased -> proves modification flows through.
  #   * scenario=block&block_at=K -> emits blocking_message at chunk K.
  server {
    listen 9001;

    location /analyze {
      content_by_lua_block {
        local server = require "resty.websocket.server"
        local cjson  = require "cjson.safe"

        local wb, err = server:new{ timeout = 30000, max_payload_len = 65535 }
        if not wb then
          ngx.log(ngx.ERR, "mock-cato: ws new failed: ", err)
          return ngx.exit(444)
        end

        local scenario = ngx.var.arg_scenario or "clean"
        local block_at = tonumber(ngx.var.arg_block_at) or 3

        local function verdict_for(rec)
          local out = rec.data
          if rec.id % 2 == 0 then out = string.upper(out) end
          return cjson.encode({ type = "verified_chunk", id = rec.id, data = out })
        end

        local pending  -- last buffered {id,data}, released on next arrival

        while true do
          local data, typ, recv_err = wb:recv_frame()
          if not data then
            if recv_err and recv_err ~= "timeout" then
              ngx.log(ngx.ERR, "mock-cato: recv failed: ", recv_err)
              break
            end
          elseif typ == "close" then
            break
          elseif typ == "text" then
            local msg = cjson.decode(data)
            if not msg then
              ngx.log(ngx.ERR, "mock-cato: bad json: ", data)
              break
            end

            if msg.type == "data" then
              if scenario == "block" and msg.id >= block_at then
                wb:send_text(cjson.encode({
                  type = "blocking_message",
                  message = "blocked at chunk " .. msg.id,
                }))
                break
              end
              if pending then
                wb:send_text(verdict_for(pending))   -- release the held chunk
              end
              pending = { id = msg.id, data = msg.data }

            elseif msg.type == "upstream_done" then
              if pending then
                wb:send_text(verdict_for(pending))
              end
              wb:send_text(cjson.encode({ type = "done" }))
              break

            elseif msg.type == "upstream_error" then
              wb:send_text(cjson.encode({ type = "done" }))
              break
            end
          end
        end

        wb:send_close()
      }
    }
  }
}
